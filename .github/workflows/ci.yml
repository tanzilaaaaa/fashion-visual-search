name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · lint + tests
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q   # fake encoder + synthetic index; real-CLIP tests are opt-in (-m clip)

  ml:
    name: ML pipeline · lint + unit tests
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ml } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  frontend:
    name: Frontend · typecheck + tests + build
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run build

  docker:
    name: Backend image builds
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: fvs-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Frontend deploys through Vercel's Git integration (every push to main).
  deploy-backend:
    name: Deploy backend → Hugging Face Space
    runs-on: ubuntu-latest
    needs: [backend, ml, frontend, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.HF_SPACE != ''
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Push backend/ to the Space repo
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}   # e.g. your-username/fashion-visual-search-api
        run: |
          cp deploy/huggingface/README.md backend/README.md
          git config user.email "ci@github.com"
          git config user.name "github-actions"
          git add backend/README.md
          git commit -m "Space README" || true
          git subtree split --prefix backend -b space-deploy
          git push --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" space-deploy:main
      - name: Verify GET /health (model + index loaded)
        env:
          API_URL: ${{ vars.API_URL }}     # e.g. https://your-username-fashion-visual-search-api.hf.space
        run: |
          for i in $(seq 1 60); do
            if curl -fsS "$API_URL/health" | grep -q '"index_loaded":true'; then echo "healthy"; exit 0; fi
            sleep 20
          done
          echo "backend did not become healthy in time"
          exit 1
