[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fvs-ml"
version = "1.0.0"
description = "Offline DeepFashion2 → CLIP ViT-B/32 → FAISS indexing and evaluation pipeline"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1",
  "pyarrow>=15",
  "pillow>=10.2",
  "opencv-python-headless>=4.9",
  "faiss-cpu>=1.8",
  "torch>=2.2",
  "open_clip_torch>=2.24",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
notebooks = ["matplotlib>=3.8", "jupyter"]

[tool.setuptools.packages.find]
include = ["fvs_ml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
extend-exclude = ["notebooks"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
extend-ignore = ["B905"]
