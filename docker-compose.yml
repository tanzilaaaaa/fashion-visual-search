# Local full stack: API on :8000, UI on :5173.
# Put artifacts in backend/artifacts first (Kaggle output, or `make dev-index`).
services:
  api:
    build: { context: ./backend }
    environment:
      PORT: "8000"
      ALLOWED_ORIGINS: http://localhost:5173
    ports: ["8000:8000"]
    volumes:
      - ./backend/artifacts:/app/artifacts:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 15s
      start_period: 60s

  web:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports: ["5173:5173"]
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      api: { condition: service_healthy }
