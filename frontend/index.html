<!doctype html>
<html lang="en" data-theme="atelier">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#faf7f2" />
    <meta name="description" content="Lookbook — search fashion by description or by photo. CLIP + FAISS visual search and outfit recommendations over DeepFashion2." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved (or system) theme before first paint, so there is no flash.
      (function () {
        var ids = ["atelier", "midnight", "blush", "noir"], t = null;
        try { t = localStorage.getItem("lookbook.theme"); } catch (e) {}
        if (ids.indexOf(t) < 0) {
          t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "midnight" : "atelier";
        }
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
    <title>Lookbook — Fashion Visual Search</title>
  </head>
  <body class="font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
